# $HOME/.config/alacritty/alacritty.toml

[window]
opacity = 0.9
padding.x = 10
padding.y = 10
decorations = "Full"
decorations_theme_variant = "Dark" # Changed to Dark to match the colors below

[font.normal]
family = "Atkinson Hyperelegible Mono"
style = "monospace"
[font]
size = 12.5
# (leave your font and window settings up here as they are)

#[colors.primary]
#background = "#1e1e2e" # just an example dark background
#foreground = "#cdd6f4" # your main text color

[colors.normal]
black   = "#111111"
red     = "#d35c5c" # rich crimson, not highlighter red
green   = "#56b666" # solid grass green, less radioactive
yellow  = "#d8a657" # warm gold instead of faded easter egg yellow
blue    = "#4a88c7" # strong ocean blue
magenta = "#ad74cc" # deep violet
cyan    = "#16a9a0" # your custom teal!
white   = "#cccccc" # clean, soft white
